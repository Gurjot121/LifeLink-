

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | LifeLink</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <a href="index.html" class="logo">Life<span>Link.</span></a>
    <a href="login.html" class="btn btn-light">Login</a>
</nav>

<div class="auth-wrapper">

    <div class="auth-card">

        <h2>Create Account</h2>
        <p>Join the LifeLink network.</p>

        <div id="message"></div>

        <form id="registerForm">

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="regUsername"
                       placeholder="Choose username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="regPassword"
                       placeholder="Create password" required minlength="6">
            </div>

            <div class="form-group">
                <label>Register As</label>
                <select id="regRole" required>
                    <option value="">Select account type</option>
                    <option value="REQUESTER">Requester</option>
                    <option value="ORGANISATION">Organisation</option>
                </select>
            </div>

            <div id="organisationFields" class="hidden">

                <div class="form-group">
                    <label>Organisation Name</label>
                    <input type="text" id="orgName"
                           placeholder="Enter organisation name">
                </div>

                <div class="form-group">
                    <label>Organisation Type</label>
                    <select id="orgType">
                        <option value="">Select type</option>
                        <option value="NGO">NGO</option>
                        <option value="HOSPITAL">Hospital</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="orgCity"
                           placeholder="Enter city">
                </div>

            </div>

            <button type="submit" class="btn btn-primary full-width">
                Create Account
            </button>

        </form>

        <p style="text-align:center; margin-top:20px;">
            Already registered?
            <a href="login.html" style="color:#9F1D35;font-weight:700;">
                Login
            </a>
        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
