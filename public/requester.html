
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Requester Dashboard | LifeLink</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <a href="index.html" class="logo">Life<span>Link.</span></a>
    <div class="nav-links">
        <span id="welcomeUser">Requester</span>
        <button class="btn btn-light" onclick="logout()">Logout</button>
    </div>
</nav>

<div class="dashboard">

    <aside class="sidebar">
        <h3>Requester Panel</h3>
        <a href="#overview" class="active">Overview</a>
        <a href="#search">Find Blood</a>
        <a href="#request">Request Blood</a>
        <a href="#tracking">My Requests</a>
    </aside>

    <main class="main-content">

        <section id="overview">

            <div class="page-heading">
                <h1>Requester Dashboard</h1>
                <p>Find blood and manage your requests.</p>
            </div>

            <div class="stats-grid">

                <div class="stat-card">
                    <p>Total Requests</p>
                    <h2 id="totalRequests">0</h2>
                </div>

                <div class="stat-card">
                    <p>Open Requests</p>
                    <h2 id="openRequests">0</h2>
                </div>

                <div class="stat-card">
                    <p>Fulfilled Requests</p>
                    <h2 id="fulfilledRequests">0</h2>
                </div>

            </div>

        </section>

        <section id="search" class="content-card">

            <h2>Find Available Blood</h2>

            <div class="search-row">

                <select id="searchBlood">
                    <option value="">Select Blood Group</option>
                    <option>A+</option>
                    <option>A-</option>
                    <option>B+</option>
                    <option>B-</option>
                    <option>AB+</option>
                    <option>AB-</option>
                    <option>O+</option>
                    <option>O-</option>
                </select>

                <input type="text" id="searchCity"
                       placeholder="Enter city">

                <button class="btn btn-primary"
                        onclick="searchOrganisations()">
                    Search
                </button>

            </div>

            <div id="organisationResults"></div>

        </section>

        <section id="request" class="content-card">

            <h2>Submit Blood Request</h2>

            <div id="requestMessage"></div>

            <form id="bloodRequestForm">

                <div class="form-group">
                    <label>Blood Group Required</label>
                    <select id="requestBlood" required>
                        <option value="">Choose Blood Group</option>
                        <option>A+</option>
                        <option>A-</option>
                        <option>B+</option>
                        <option>B-</option>
                        <option>AB+</option>
                        <option>AB-</option>
                        <option>O+</option>
                        <option>O-</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Units Required</label>
                    <input type="number" id="requestUnits"
                           min="1" placeholder="Enter number of units" required>
                </div>

                <div class="form-group">
                    <label>City</label>
                    <input type="text" id="requestCity"
                           placeholder="Enter your city" required>
                </div>

                <div class="form-group">
                    <label>Urgency</label>
                    <select id="requestUrgency" required>
                        <option value="NORMAL">Normal</option>
                        <option value="URGENT">Urgent</option>
                        <option value="EMERGENCY">Emergency</option>
                    </select>
                </div>

                <button type="submit" class="btn btn-primary">
                    Submit Request
                </button>

            </form>

        </section>

        <section id="tracking" class="content-card">

            <h2>My Blood Requests</h2>

            <div id="myRequests"></div>

        </section>

    </main>

</div>

<script src="js/login.js"></script>
<script src="js/requester.js"></script>

</body>
</html>
