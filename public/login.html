
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LifeLink</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<nav class="navbar">
    <a href="index.html" class="logo">Life<span>Link.</span></a>
    <a href="index.html" class="btn btn-light">Back Home</a>
</nav>

<div class="auth-wrapper">

    <div class="auth-card">

        <h2>Welcome Back!</h2>
        <p>Login to continue to your LifeLink account.</p>

        <div id="message"></div>

        <form id="loginForm">

            <div class="form-group">
                <label>Username</label>
                <input type="text" id="username"
                       placeholder="Enter username" required>
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password"
                       placeholder="Enter password" required>
            </div>

            <div class="form-group">
                <label>Login As</label>
                <select id="role" required>
                    <option value="">Select your role</option>
                    <option value="REQUESTER">Requester</option>
                    <option value="ORGANISATION">Organisation</option>
                    <option value="ADMIN">Admin</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary full-width">
                Login
            </button>

        </form>

        <p style="text-align:center; margin-top:20px;">
            Don't have an account?
            <a href="register.html" style="color:#9F1D35;font-weight:700;">
                Register here
            </a>
        </p>

    </div>

</div>

<script src="js/login.js"></script>

</body>
</html>
